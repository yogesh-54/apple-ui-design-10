<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <!-- Clean Apple light background -->
  <rect width="400" height="480" fill="#ffffff" rx="28"/>
  
  <!-- Subtle tech ecosystem gradient -->
  <rect x="30" y="30" width="340" height="420" rx="20" fill="#fbfbfd" stroke="#e5e5ea" stroke-width="1.5"/>

  <!-- MacBook Pro stylized outline -->
  <rect x="70" y="70" width="260" height="160" rx="12" fill="#e5e5ea" stroke="#d1d1d6" stroke-width="2"/>
  <rect x="80" y="80" width="240" height="140" rx="6" fill="#1c1c1e"/>
  <path d="M50 230h300v8c0 4-4 8-8 8H58c-4 0-8-4-8-8v-8z" fill="#d1d1d6"/>
  
  <!-- Automatic Switching Banner Pill (Dynamic Island style) -->
  <rect x="90" y="100" width="220" height="44" rx="22" fill="#000000" stroke="#333333" stroke-width="1"/>
  <circle cx="114" cy="122" r="10" fill="#0071e3"/>
  <!-- AirPods mini icon inside pill -->
  <path d="M110 118c0-2 2-4 4-4s4 2 4 4v5c0 1-.5 2-1.5 2" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <text x="134" y="121" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="10.5" fill="#ffffff">AirPods Pro</text>
  <text x="134" y="133" font-family="-apple-system, Inter, sans-serif" font-weight="400" font-size="9" fill="#98989d">Connected to MacBook Pro</text>

  <!-- iPhone stylized at bottom right corner -->
  <rect x="220" y="220" width="110" height="180" rx="20" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="4"/>
  <rect x="226" y="226" width="98" height="168" rx="16" fill="#2c2c2e"/>
  <rect x="255" y="232" width="40" height="8" rx="4" fill="#000000"/>

  <text x="200" y="425" text-anchor="middle" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="14" fill="#1d1d1f">Move audio between Mac & iPhone</text>
</svg>
