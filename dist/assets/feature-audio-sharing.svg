<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="blurBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c2c2e"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
  </defs>
  <!-- iPhone frame -->
  <rect x="40" y="20" width="320" height="440" rx="36" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="6"/>
  <rect x="52" y="32" width="296" height="416" rx="28" fill="url(#blurBg)"/>
  <rect x="150" y="44" width="100" height="24" rx="12" fill="#000000"/>
  
  <!-- Control center card -->
  <rect x="68" y="90" width="264" height="330" rx="24" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.15)"/>
  <!-- Album Art + Track -->
  <rect x="86" y="110" width="48" height="48" rx="8" fill="#ff2d55"/>
  <text x="146" y="130" font-family="-apple-system, Inter, sans-serif" font-weight="600" font-size="14" fill="#ffffff">Bad Romance</text>
  <text x="146" y="148" font-family="-apple-system, Inter, sans-serif" font-weight="400" font-size="12" fill="#98989d">Lady Gaga</text>
  
  <!-- Headphones 1 Volume Slider -->
  <g transform="translate(86, 185)">
    <text x="0" y="0" font-family="-apple-system, Inter, sans-serif" font-weight="500" font-size="12" fill="#ebebf5">Sam’s AirPods</text>
    <rect x="0" y="10" width="228" height="38" rx="19" fill="rgba(255,255,255,0.15)"/>
    <rect x="0" y="10" width="180" height="38" rx="19" fill="#ffffff"/>
  </g>

  <!-- Headphones 2 Volume Slider -->
  <g transform="translate(86, 260)">
    <text x="0" y="0" font-family="-apple-system, Inter, sans-serif" font-weight="500" font-size="12" fill="#ebebf5">Sarah’s AirPods</text>
    <rect x="0" y="10" width="228" height="38" rx="19" fill="rgba(255,255,255,0.15)"/>
    <rect x="0" y="10" width="135" height="38" rx="19" fill="#ffffff"/>
  </g>

  <!-- Audio Sharing icon & button -->
  <rect x="110" y="340" width="180" height="36" rx="18" fill="rgba(255,255,255,0.2)"/>
  <text x="200" y="363" text-anchor="middle" font-family="-apple-system, Inter, sans-serif" font-weight="500" font-size="13" fill="#ffffff">Share Audio...</text>
</svg>
